name: Bug report
description: Something returns a wrong answer, panics or allocates more than documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Module version
      placeholder: v1.7.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and platform
      placeholder: go1.27.0 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest program or test that shows the problem.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
